name: cross-OS profile checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-smoke:
    name: ${{ matrix.os }} profile smoke test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EUROZONE_ALLOW_OS_TESTS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Check shell syntax and shared country profiles
        shell: bash
        run: |
          for script in eurozone eurozone.command tests/*.sh; do bash -n "$script"; done
          bash tests/profile-catalog-smoke.sh
          bash tests/unix-isolated-smoke.sh

      - name: Check isolated Windows parsing and regional behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-isolated-smoke.ps1

      - name: Apply and restore Windows user region
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-profile-smoke.ps1

      - name: Apply and restore macOS user region
        if: runner.os == 'macOS'
        shell: bash
        # The launcher and login item use Apple's /bin/bash 3.2. Test that one.
        run: |
          /bin/bash --version | head -n 1
          /bin/bash tests/unix-isolated-smoke.sh
          /bin/bash tests/macos-profile-smoke.sh

      - name: Apply and restore Linux GNOME user region
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon dbus-x11 dconf-gsettings-backend gsettings-desktop-schemas locales x11-xkb-utils x11-xserver-utils xvfb
          sudo sed -i '/^# *de_DE.UTF-8 UTF-8/s/^# *//' /etc/locale.gen
          sudo sed -i '/^# *fr_FR.UTF-8 UTF-8/s/^# *//' /etc/locale.gen
          sudo sed -i '/^# *en_IE.UTF-8 UTF-8/s/^# *//' /etc/locale.gen
          sudo locale-gen
          xvfb-run -a --server-args='-noreset' bash tests/linux-x11-key-smoke.sh
          bash tests/linux-profile-smoke.sh
